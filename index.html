<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Κουίζ 💌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐻</text></svg>">
<style>
  :root {
    --bg: #f6e3e0;
    --card: #fffaf7;
    --ink: #3b1f2b;
    --soft: #8a6270;
    --accent: #c2334d;
    --good: #2f6b4f;
    --bad: #b3332f;
    --line: #ecc9c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a1620;
      --card: #3a2230;
      --ink: #fbe9e7;
      --soft: #d1a6b3;
      --accent: #ff7a90;
      --good: #3f8c68;
      --bad: #c4504b;
      --line: #5a3646;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 460px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 22px;
    padding: 28px 24px 24px;
    box-shadow: 0 10px 0 var(--line);
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    line-height: 1.25;
    margin: 0 0 8px;
  }
  .sub { color: var(--soft); margin: 0 0 20px; }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
  .tag {
    display: inline-block; background: var(--accent); color: #fff; font-weight: bold;
    border-radius: 99px; padding: 3px 12px; margin-bottom: 10px; font-size: .9rem;
  }
  .q { font-family: Georgia, "Times New Roman", serif; font-size: 1.4rem; line-height: 1.3; margin: 0 0 18px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .opt {
    text-align: left; background: transparent; border: 2px solid var(--line);
    border-radius: 14px; padding: 13px 16px; font-size: 1.05rem;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt.right { background: var(--good); border-color: var(--good); color: #fff; }
  .opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }
  .feedback { min-height: 28px; margin: 14px 0 0; font-weight: bold; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 14px;
    padding: 13px 22px; font-size: 1.05rem; font-weight: bold;
  }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .next { margin-top: auto; align-self: flex-end; }
  .center { text-align: center; }
  .big { font-size: 4rem; margin: 6px 0; }
  .prize { border: 2px dashed var(--accent); border-radius: 16px; padding: 14px; margin: 16px 0 22px; }
  .final-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; min-height: 56px; }
  #dodge.moving { position: fixed; z-index: 5; margin: 0; }
  .meme-slot { height: 124px; display: flex; align-items: center; justify-content: center; margin: 4px 0 14px; }
  .meme-slot img {
    height: 112px; width: auto; max-width: 100%; border-radius: 12px;
    border: 3px solid var(--line); visibility: hidden;
  }
  .meme-slot img.show { visibility: visible; }
  .hidden { display: none !important; }

  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(30, 10, 20, .8);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .video-box { display: flex; flex-direction: column; gap: 12px; align-items: center; width: min(720px, 96vw); }
  .video-wrap { width: 100%; aspect-ratio: 16/9; }
  .video-wrap iframe { width: 100%; height: 100%; border: 0; border-radius: 14px; }
  .video-box a { color: #fff; }
  .video-box a { color: #fff; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="card" id="card"></main>

<div class="overlay hidden" id="videoOverlay" role="dialog" aria-label="Βίντεο">
  <div class="video-box">
    <div class="video-wrap" id="videoWrap"></div>
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">Δεν παίζει; Πάτα εδώ 🎶</a>
    <button class="btn ghost" id="closeVideo">Κλείσιμο</button>
  </div>
</div>

<script>
  // Η πρώτη επιλογή κάθε ερώτησης είναι η σωστή. Οι επιλογές ανακατεύονται αυτόματα.
  var questions = [
    {
      q: "Πόσο καλά με ξέρεις;\n1. Όταν δεν μου απαντάς…",
      opts: ["Νευριάζω", "Αδιαφορώ", "Μπλοκ", "Στέλνω μήνυμα στον Πέτρο"],
      ok: "Πάλι καλά δεν είπες τον Πέτρο 💕",
      bad: "Αααα καλα"
    },
    {
      q: "2. Πόσο συχνά σε σκέφτομαι;",
      opts: ["Συνέχεια", "Μία φορά το μήνα", "Μόνο τις Κυριακές", "Όταν βλέπω αρκουδάκι 🐻"],
      ok: "Ισχύει 🥰",
      bad: "Λάθος! Προσπάθησε πιο σοβαρά 🙃"
    },
    {
      q: "3. Είσαι το…",
      opts: ["🐻", "🥔", "🦆", "🪑"],
      ok: "Το αρκουδάκι μου 🐻",
      bad: "Βάλε τα γυαλια σου, ήταν ευκολο 😎"
    },
    {
      q: "4. Μου αρέσουν τα Χριστούγεννα",
      opts: ["Ζω για αυτά 🎄", "Τι είναι τα Χριστούγεννα;", "Προτιμώ το Πάσχα", "Τζάμπα η αναστάτωση"],
      ok: "Χιχιχιχιχ 🎄✨",
      bad: "Με απογοητεύεις 😢"
    },
    {
      q: "5. Πόσο σε αγαπάω;",
      opts: ["Από τη γη ως το φεγγάρι 🌍🌙", "Μέχρι το περίπτερο", "Όσο η Σοφία", "Λιγάκι, κατά βούληση"],
      ok: "και απο το φεγγάρι πίσω εδώ... 🌙💖",
      bad: "Πολύ περισσότερο από αυτό 💔"
    }
  ];

  var card = document.getElementById("card");
  var videoOverlay = document.getElementById("videoOverlay");
  var videoWrap = document.getElementById("videoWrap");
  var idx = 0;
  var missed = [];       // ερωτήσεις που πήγε λάθος
  var score = 0;

  function el(html) { card.innerHTML = html; }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showIntro() {
    el(
      '<div class="center">' +
      '<div class="big">💌</div>' +
      '<h1>Κουίζ</h1>' +
      '<p class="sub">Απάντησε σωστά και κέρδισε πλούσια δώρα! 🎁<br>Πόσο καλά με ξέρεις;</p>' +
      '<button class="btn" id="start">Ξεκινάμε</button>' +
      '</div>'
    );
    document.getElementById("start").onclick = function () {
      idx = 0; score = 0; missed = [];
      showQuestion();
    };
  }

  // Γενική ερώτηση. Στο bonus δεν υπάρχει "προχωράς με λάθος": πρέπει να βρει τη σωστή.
  function askQuestion(qIndex, opts) {
    var item = questions[qIndex];
    var isBonus = opts.bonus;
    var correct = item.opts[0];
    var html = '';

    if (isBonus) {
      html += '<span class="tag">🎰 Bonus γύρος ' + opts.step + '/' + opts.total + '</span>';
    } else {
      html += '<div class="progress"><div style="width:' + (qIndex / questions.length * 100) + '%"></div></div>';
    }
    html += '<p class="q">' + item.q.replace(/\n/g, "<br>") + '</p><div class="opts">';
    shuffle(item.opts).forEach(function (o) {
      html += '<button class="opt" data-v="' + o.replace(/"/g, "&quot;") + '">' + o + '</button>';
    });
    html += '</div><p class="feedback" id="fb" aria-live="polite"></p>' +
      '<button class="btn next hidden" id="next">' + opts.nextLabel + '</button>';
    el(html);

    var buttons = card.querySelectorAll(".opt");
    var fb = document.getElementById("fb");
    var next = document.getElementById("next");
    var answeredWrong = false;

    buttons.forEach(function (b) {
      b.onclick = function () {
        var isRight = b.getAttribute("data-v") === correct;
        if (isRight) {
          buttons.forEach(function (x) { x.disabled = true; });
          b.classList.add("right");
          fb.className = "feedback good";
          fb.textContent = item.ok;
          next.classList.remove("hidden");
          if (!isBonus) {
            if (!answeredWrong) score++;
            card.querySelector(".progress > div").style.width = ((qIndex + 1) / questions.length * 100) + "%";
          }
        } else {
          b.classList.add("wrong");
          b.disabled = true;
          fb.className = "feedback bad";
          fb.textContent = item.bad;
          if (!isBonus) {
            // Στον κανονικό γύρο μία λάθος επιλογή αρκεί: η ερώτηση χάνεται
            buttons.forEach(function (x) {
              x.disabled = true;
              if (x.getAttribute("data-v") === correct) x.classList.add("right");
            });
            missed.push(qIndex);
            next.classList.remove("hidden");
            card.querySelector(".progress > div").style.width = ((qIndex + 1) / questions.length * 100) + "%";
          } else {
            fb.textContent = item.bad + " Ξαναδοκίμασε!";
          }
        }
      };
    });
    next.onclick = opts.onNext;
  }

  function showQuestion() {
    askQuestion(idx, {
      bonus: false,
      nextLabel: idx === questions.length - 1 ? "Αποτελέσματα" : "Επόμενη",
      onNext: function () {
        idx++;
        if (idx < questions.length) showQuestion(); else showResults();
      }
    });
  }

  function showResults() {
    var total = questions.length;
    if (missed.length === 0) {
      el(
        '<div class="center">' +
        '<div class="big">🏆</div>' +
        '<h1>Αποτελέσματα</h1>' +
        '<p class="sub">Σκορ: ' + total + '/' + total + '. Τέλειο!</p>' +
        '<div class="prize">🎁 Έχεις κερδίσει πλούσια δώρα!<br>(οι λεπτομέρειες ακολουθούν…)</div>' +
        '<button class="btn" id="toFinal">Συνέχεια</button>' +
        '</div>'
      );
      document.getElementById("toFinal").onclick = showFinal;
    } else {
      var n = missed.length;
      el(
        '<div class="center">' +
        '<div class="big">😅</div>' +
        '<h1>Αποτελέσματα</h1>' +
        '<p class="sub">Σκορ: ' + score + '/' + total + '.<br>' +
        'Πήγες λάθος ' + n + (n === 1 ? ' ερώτηση' : ' ερωτήσεις') + ', αλλά δεν πειράζει!</p>' +
        '<div class="prize">Τα λάθη δεν σε γλιτώνουν από την τελευταία ερώτηση 😏</div>' +
        '<button class="btn" id="toFinal">Συνέχεια</button>' +
        '</div>'
      );
      document.getElementById("toFinal").onclick = showFinal;
    }
  }

  function showBonus(step) {
    if (step >= missed.length) { showBonusDone(); return; }
    askQuestion(missed[step], {
      bonus: true,
      step: step + 1,
      total: missed.length,
      nextLabel: step === missed.length - 1 ? "Τέλος bonus" : "Επόμενος bonus",
      onNext: function () { showBonus(step + 1); }
    });
  }

  function showBonusDone() {
    el(
      '<div class="center">' +
      '<div class="big">🎉</div>' +
      '<h1>Τα κατάφερες!</h1>' +
      '<p class="sub">Τα bonus ολοκληρώθηκαν.</p>' +
      '<div class="prize">🎁 Έχεις κερδίσει πλούσια δώρα!<br>(οι λεπτομέρειες ακολουθούν…)</div>' +
      '<button class="btn" id="toFinal">Συνέχεια</button>' +
      '</div>'
    );
    document.getElementById("toFinal").onclick = showFinal;
  }

  function rectsOverlap(a, b, pad) {
    return !(a.right + pad < b.left || a.left - pad > b.right ||
             a.bottom + pad < b.top || a.top - pad > b.bottom);
  }

  function showFinal() {
    el(
      '<div class="center">' +
      '<div class="big">🥺</div>' +
      '<p class="q">Εσύ με αγαπάς;</p>' +

      '</div>'
    );

    var dodge = document.getElementById("dodge");
    var meme = document.getElementById("meme");
    var yes = document.getElementById("yes");

    function moveDodge() {
      // πρώτα βγαίνει από τη ροή της σελίδας, ώστε να μετρηθούν σωστά οι υπόλοιπες θέσεις
      dodge.classList.add("moving");
      var w = dodge.offsetWidth, h = dodge.offsetHeight;
      var maxX = window.innerWidth - w - 8;
      var maxY = window.innerHeight - h - 8;
      var memeR = meme.getBoundingClientRect();
      var yesR = yes.getBoundingClientRect();
      var x = 8, y = 8, found = false;

      for (var i = 0; i < 300; i++) {
        var cx = 8 + Math.random() * Math.max(0, maxX - 8);
        var cy = 8 + Math.random() * Math.max(0, maxY - 8);
        var r = { left: cx, top: cy, right: cx + w, bottom: cy + h };
        if (!rectsOverlap(r, memeR, 14) && !rectsOverlap(r, yesR, 10)) {
          x = cx; y = cy; found = true; break;
        }
      }
      if (!found) { x = 8; y = maxY; }   // κάτω αριστερά, αν δεν βρεθεί θέση
      dodge.style.left = x + "px";
      dodge.style.top = y + "px";
    }

    dodge.onclick = function () {
      meme.classList.add("show");   // η εικόνα εμφανίζεται και μένει
      moveDodge();
    };

    yes.onclick = function () {
      // χωρίς autoplay: ο χρήστης πατάει το play μόνος του
      videoWrap.innerHTML =
        '<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Βίντεο" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      videoOverlay.classList.remove("hidden");
    };
  }

  document.getElementById("closeVideo").onclick = function () {
    videoOverlay.classList.add("hidden");
    videoWrap.innerHTML = "";
  };

  showIntro();
</script>
